name: Учебные материалы и исполняемые примеры
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ссылки, оглавления и адреса страниц
        run: python3 scripts/check-markdown.py
      - name: Полные Java-примеры из страниц
        run: python3 scripts/check-java-examples.py
      - name: Core и многопоточность
        run: |
          mkdir -p "$RUNNER_TEMP/learning-java"
          javac --release 17 -Xlint:all -d "$RUNNER_TEMP/learning-java" examples/java-core/CoreExamples.java examples/java-concurrency/ConcurrencyExamples.java
          java -ea -cp "$RUNNER_TEMP/learning-java" CoreExamples
          java -ea -cp "$RUNNER_TEMP/learning-java" ConcurrencyExamples
      - name: MCP transport и стабильная маршрутизация
        run: |
          python3 examples/ai-agents/demo_mcp.py --self-test
          python3 'базы данных/postgresql/examples/02-stable-routing.py'
      - name: 'DynamoDB lab: проверка отказов и очистки без AWS'
        run: python3 examples/infra/02-dynamodb/02-test-lab.py
      - name: Запрет публикации при провале gate
        run: python3 examples/infra/01-ci-package/04-test-publish-gate.py
  java-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pom:
          - examples/testing/pom.xml
          - examples/spring-security/pom.xml
          - examples/spring-behavior/pom.xml
          - examples/infra/01-ci-package/pom.xml
          - examples/java-core/orm/pom.xml
          - очереди/кафка/examples/streams/pom.xml
          - очереди/activemq/examples/acknowledgement/pom.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B --no-transfer-progress -f '${{ matrix.pom }}' verify
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Интеграционная проверка настоящего Redis
        run: mvn -B --no-transfer-progress -f examples/testing/pom.xml -Pcontainers verify
      - name: Ограничения и триггеры PostgreSQL
        run: |
          docker run --detach --rm --name learning-pg -e POSTGRES_PASSWORD=local-demo postgres:18.6
          trap 'docker rm -f learning-pg >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            # entrypoint сначала запускает временный сервер только на Unix socket.
            # TCP открывается уже после завершения initdb и финального запуска.
            if docker exec learning-pg pg_isready -h 127.0.0.1 -U postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec -i -e PGPASSWORD=local-demo learning-pg psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 < 'базы данных/postgresql/examples/01-partition-constraints.sql'
      - name: Правила и временные ряды Prometheus
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/examples/infra/03-observability:/work:ro" -w /work prom/prometheus:v3.5.0 check rules 01-rules.yaml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/examples/infra/03-observability:/work:ro" -w /work prom/prometheus:v3.5.0 test rules 02-rules.test.yaml
